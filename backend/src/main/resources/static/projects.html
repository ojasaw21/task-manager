<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TaskFlow — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">⚡</div><span>TaskFlow</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a class="nav-link" href="/dashboard.html"><span class="nav-icon">📊</span>Dashboard</a>
      <a class="nav-link active" href="/projects.html"><span class="nav-icon">📁</span>Projects</a>
      <a class="nav-link" href="/tasks.html"><span class="nav-icon">✅</span>My Tasks</a>
      <div class="nav-section-label" id="admin-label" style="display:none">Admin</div>
      <a class="nav-link admin-only" href="/users.html" style="display:none"><span class="nav-icon">👥</span>Team Members</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div id="sb-avatar" class="avatar" style="background:#6366f1"></div>
        <div><div class="user-name" id="sb-name"></div><div class="user-role" id="sb-role"></div></div>
      </div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Projects</h1>
        <p class="page-subtitle">Manage your projects and teams</p>
      </div>
      <button class="btn btn-primary" id="btn-new-project" style="display:none" onclick="openProjectModal()">+ New Project</button>
    </div>

    <div class="filter-bar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" class="form-control" placeholder="Search projects…" oninput="filterProjects()"/>
      </div>
      <select class="form-control" id="filter-status" style="width:auto" onchange="filterProjects()">
        <option value="">All Statuses</option>
        <option value="ACTIVE">Active</option>
        <option value="COMPLETED">Completed</option>
        <option value="ON_HOLD">On Hold</option>
        <option value="ARCHIVED">Archived</option>
      </select>
    </div>

    <div class="projects-grid" id="projects-grid"><div class="spinner"></div></div>
  </main>
</div>

<!-- PROJECT MODAL -->
<div class="modal-overlay" id="project-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">New Project</div>
      <button class="modal-close" onclick="closeProjectModal()">✕</button>
    </div>
    <form onsubmit="saveProject(event)">
      <div class="form-group">
        <label class="form-label">Project Name *</label>
        <input type="text" id="p-name" class="form-control" placeholder="e.g. Website Redesign" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea id="p-desc" class="form-control" rows="3" placeholder="What is this project about?"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="p-status" class="form-control">
            <option value="ACTIVE">Active</option>
            <option value="ON_HOLD">On Hold</option>
            <option value="COMPLETED">Completed</option>
            <option value="ARCHIVED">Archived</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Deadline</label>
          <input type="date" id="p-deadline" class="form-control"/>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeProjectModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-project-btn">Create Project</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/projects.js"></script>
</body>
</html>
