<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TaskFlow — Login</title>
<meta name="description" content="Sign in to TaskFlow - Your modern team task manager"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-particles" id="particles"></div>
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">⚡</div>
      <span style="font-family:'Poppins',sans-serif;font-weight:700;font-size:20px">TaskFlow</span>
    </div>
    <p class="auth-subtitle">Team Task Manager · Role-Based Access</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <!-- LOGIN FORM -->
    <form id="login-form" onsubmit="doLogin(event)">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required/>
      </div>
      <div style="margin-top:4px;margin-bottom:12px;font-size:12px;color:var(--text-muted)">
        Demo: <strong style="color:var(--accent-light)">admin@taskmanager.com</strong> / <strong style="color:var(--accent-light)">Admin123!</strong>
      </div>
      <button type="submit" class="auth-btn" id="login-btn">Sign In →</button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signup-form" style="display:none" onsubmit="doSignup(event)">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="su-name" class="form-control" placeholder="Jane Doe" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="su-email" class="form-control" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="su-password" class="form-control" placeholder="Min. 6 characters" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select id="su-role" class="form-control">
          <option value="MEMBER">Member</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>
      <button type="submit" class="auth-btn" id="signup-btn">Create Account →</button>
    </form>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
